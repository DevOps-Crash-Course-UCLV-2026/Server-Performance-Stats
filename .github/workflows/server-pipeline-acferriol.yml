name: Server Stats Pipeline - acferriol

on: 
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs: 
    linting:
        runs-on: ubuntu-latest
        name: "Linting"
        steps:
            - uses: actions/ckeckout@v4
            - uses: ludeeus/shellcheck-action@v0
              with:
                severity: 'CRITICAL'
    
    
    security:
        needs: linting
        runs-on: ubuntu-latest
        name: "Security"
        steps:
            - uses: actions/checkout@v4
            - uses: aquasecurity/trivy-action@master
              with:
                severity: 'CRITICAL'
    
    build-publish:
        needs: [linting, security]
        runs-on: ubuntu-latest
        name: 'Build and Publish'
        permissions:
            contents: read
            packages: write 
        steps:
            - uses: actions/checkout@v4
            - uses: docker/login-action@v3
              with: 
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v5
              with:
                context: .
                file: ./docker-acferriol/Dockerfile
                push: true
                tags: |
                    ghcr.io/${{ github.actor }}/server-stats:${{ github.sha }}
                    ghcr.io/${{ github.actor }}/server-stats:latest




